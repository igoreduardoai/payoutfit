  Princess Ada-ihuoma), Signoff, and Plumb. Kane Intake is an invoice-intake app
  with a Kane closed loop; it is not payout-to-journal CSV reconciliation. None
  of the eight share PayoutFit's differentiator (payout CSV to a net deposit and
  a bookkeeping journal CSV, with a Kane closed loop). The same showcase also
  lists a prior in-person gallery, "Kane CLI Hack Day SF", headed "23 projects".
  https://www.kaneclihack.sh/ship is that hack-day showcase (page heading
  "43 teams"; 11 project cards rendered). No SF card describes payout-to-journal
  reconciliation. Luma has no project gallery. The event Slack was not opened
  (login required). No public Discord showcase was readable without logging in.
