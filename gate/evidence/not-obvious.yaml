note: >
  Official pages reread on 15 Nov 2026, America/Chicago. kaneclihack.sh and the
  Luma event page describe verifying any app with Kane CLI. They do not describe
  payout-to-journal reconciliation. The public showcase at
  https://www.kaneclihack.sh/showcase lists the current online hackathon in a
  section titled "KaneCLI Online Hackathon" with 8 projects for 12–19 November:
