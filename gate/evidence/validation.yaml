pytest: "not-run"
playwright_e2e: "not-run"
axe_violations: null
lighthouse_hero: null
gold_untouched: false
holdout_untouched: false
commands:
  - command: npm test
    when: "2026-11-14"
    result: "Vitest 3.2.7 passed 19 tests in 3 files: reconcile 12, kane-loop 5, render 2. Before the parser tests, the same suite was 14 passing tests."
  - command: npm run build
    when: "2026-11-14"
    result: "tsc --noEmit and vite build finished. The build wrote dist/index.html, one css file, and one js file."
  - command: npm start
    when: "2026-11-14"
    result: "Dependencies were already installed and dist was removed. The script printed Ready in 2.08s. Headless Chrome then showed Net deposit $320.19, Reconciled, and Chargebacks $89.50. Wall clock from npm start to that page was 2.47s."
note: "No pytest, Playwright, axe, or Lighthouse run is recorded. There is no untouched gold set and no holdout. Vitest is the suite this repo runs. The 13 Nov traces record 14 passing tests on the fixed branch and 3 failing tests on the scratch worktree."
